# Smoke tests for the parameter-sweep front-ends
# (parameterSweeps.py / attentionSweeps.py / perfRunner.py).
#
# These run as a fast sanity check whenever someone invokes
# ``ninja check-rocmlir`` so the weekly Jenkins parameter-sweep job isn't
# the only thing that catches regressions in these scripts.
#
# The tests in this directory are pure CLI checks (argparse contracts,
# ``--help`` shape, ``_positive_int`` validation) and don't need a GPU.
# Tests under ``runtime/`` actually drive the full
# rocmlir-gen | rocmlir-driver | rocm-run pipeline with ``--samples 1`` and
# are gated on a visible AMD GPU.
