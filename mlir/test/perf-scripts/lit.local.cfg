# Tests for the performance scripts (parameterSweeps.py / attentionSweeps.py /
# perfRunner.py / tuningRunner.py).
#
# These run as a fast sanity check whenever someone invokes
# ``ninja check-rocmlir`` so the weekly Jenkins parameter-sweep job isn't
# the only thing that catches regressions in these scripts.
#
# The tests in this directory don't need a GPU: they are either pure CLI checks
# (argparse contracts, ``--help`` shape, ``_positive_int`` validation) driven
# through FileCheck, or ``unittest`` suites that import the scripts and pin
# their pure-Python logic (config canonicalization, tuning DB and state file
# formats, ...). Tests under ``runtime/`` actually drive the full
# rocmlir-gen | rocmlir-driver | rocm-run pipeline with ``--samples 1`` and
# are gated on a visible AMD GPU.
