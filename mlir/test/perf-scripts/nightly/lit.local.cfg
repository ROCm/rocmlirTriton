# Nightly-only perf-script tests. These need the built rocMLIR tools but no GPU
# (they stop the pipeline before codegen), so they are gated purely on the
# nightly E2E flag (ROCMLIR_DRIVER_E2E_TEST_ENABLED, off for PR CI) rather than
# on a visible AMD GPU.
if not config.enable_rock_driver_e2e_test:
  config.unsupported = True
