directory = "PrAttentionBF16"
prefix = "rocmlir-gen"
suffix = "--operation attention -t bf16 --arch %arch -pv-strict %random_data %rocmlir_gen_flags | rocmlir-driver --host-pipeline=highlevel | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transQ"
values = ["true", "false"]
prefix = "--transQ="

[[axis]]
name = "transK"
values = ["true", "false"]
prefix = "--transK="

[[axis]]
name = "transV"
values = ["true", "false"]
prefix = "--transV="

[[axis]]
name = "transO"
values = ["true", "false"]
prefix = "--transO="

## attention variant
[[suite]]
name = "pr_attention_bf16"

[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

[[suite.test]]
config = "-seq_len_q 64 -seq_len_k 64 -head_dim_qk 64 -head_dim_v 64 -perf_config attn:v1:64,32,128,1,1,2,0,1,1,0,0 -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

## This one test kPerBlock (16 x 4) == head_dim case
## Also it has drepeats > 1 to check correct fetching
[[suite.test]]
config = "-seq_len_q 256 -seq_len_k 256 -head_dim_qk 128 -head_dim_v 128 -perf_config attn:v1:128,128,128,1,1,4,0,1,1,0,0 -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

[[suite.test]]
config = "-seq_len_q 64 -seq_len_k 64 -head_dim_qk 64 -head_dim_v 64 -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# Check a padding config
[[suite.test]]
config = "-seq_len_q 64 -seq_len_k 64 -head_dim_qk 64 -head_dim_v 64 -perf_config attn:v1:256,64,32,1,1,4,0,1,1,0,0 -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# Check lds bypass config
[[suite.test]]
config = "-seq_len_q 256 -seq_len_k 256 -head_dim_qk 128 -head_dim_v 128 -perf_config attn:v1:128,128,128,1,1,4,0,1,1,0,0 -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# check a case where MPerBlock != gemm1M
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -perf_config attn:v1:64,32,64,1,1,2,0,1,1,0,0 -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# check a case where MPerBlock != gemm1M && MPerWave < 32
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -perf_config attn:v1:64,32,64,1,1,8,0,1,1,0,0 -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# check scale
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# check bias
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# check scale and bias together
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# cross attention
[[suite.test]]
config = "-seq_len_q 128 -seq_len_k 27 -head_dim_qk 64 -head_dim_v 32 --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# issue 1661
[[suite.test]]
config = "-seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# causal
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# GQA
[[suite.test]]
config = "-num_heads_q 4 -num_heads_kv 2 -seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# GQA + KV Cache
# With `-pv-strict`, the CPU reference now matches the GPU's effective
# precision for the fused scale*QK + bias chain (both run at f32 internally,
# with a single bf16 store at the end - see rocmlir-gen.cpp and the
# attention_bf16_precision.mlir / attention-verify-strict.mlir tests for the
# details). What remains is the small bf16 noise floor from independent
# accumulation orders on CPU vs GPU, which can still flip the softmax argmax
# in the most masked configurations - hence the slightly relaxed thresholds
# on the batch=3 cases. The LSE variants need extra absDiff headroom because
# LSE values themselves are large (one bf16 ULP at LSE magnitude ~500 is ~4).
[[suite.test]]
config = "-rand 1 -current_seq_len=17 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# GQA + KV Cache batch=3
[[suite.test]]
config = "-rand 1 -current_seq_len=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias -relDiff_threshold 1.0 -absDiff_threshold 1.0 -RMS_threshold 0.15"

# GQA + KV Cache batch=3 + return LSE
[[suite.test]]
config = "-rand 1 -return_lse -current_seq_len=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias -relDiff_threshold 1.0 -absDiff_threshold 5.0 -RMS_threshold 0.15"

# GQA + KV Cache batch=3 + return LSE + split-kv
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -current_seq_len=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias -relDiff_threshold 1.0 -absDiff_threshold 5.0 -RMS_threshold 0.15"

# GQA + KV Cache batch=3 + return LSE + split-kv (padding)
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 8 -current_seq_len=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias -relDiff_threshold 1.0 -absDiff_threshold 5.0 -RMS_threshold 0.15"

# GQA + causal + KV Cache batch=3
[[suite.test]]
config = "-rand 1 -current_seq_len=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# GQA + causal + KV Cache batch=3 + return LSE
[[suite.test]]
config = "-rand 1 -return_lse -current_seq_len=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# GQA + causal + KV Cache batch=3 + return LSE + split-kv
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -current_seq_len=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"

# GQA + causal + KV Cache batch=3 + return LSE + split-kv (padding)
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 8 -current_seq_len=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15"
