#
# v_wmma_scale exists only on gfx1250 (WMMA v3, see AmdArchDb.cpp).
# arch_support_scaled_gemm alone would also admit gfx950, which runs scaled
# GEMMs on MFMA instead.
if not config.arch_support_scaled_gemm or not config.arch.startswith("gfx1250"):
    config.unsupported = True
