directory = "gemm_stream_k_f16"
prefix = "rocmlir-gen"
suffix = "--operation gemm -t f16 --arch %arch %pv %random_data %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

# streamKMultiple (v5 perf-config field before the knob block); splitK stays 1.
[[axis]]
name = "streamKMultiple"
values = ["gemm:v5:64,64,64,1,1,4,32,1,2,0,0,1,-1,-1,-1,-1,-1,-1",
          "gemm:v5:64,64,64,1,1,4,32,1,2,0,0,2,-1,-1,-1,-1,-1,-1"]
prefix = "-perf_config="

## Gemm variants
[[suite]]
name = "gemm_stream_k_f16"

[[suite.test]]
config = "-g 1 -m 640 -k 256 -n 448"

[[suite.test]]
config = "-g 1 -m 1024 -k 256 -n 1920"
