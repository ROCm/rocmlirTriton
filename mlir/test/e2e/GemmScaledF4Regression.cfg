# The first two cases leave transA/transB at their defaults, so their fp4
# operands pack along the non-K (M/N) dimension, which only lowers on arches
# with the transpose-load repack (CDNA4). The whole directory is gated on that
# rather than only those cases: the generator's [[require]] blocks key off axis
# values, and every case here shares the single-valued data-type axis.
if not config.arch_support_scaled_gemm or not config.arch_support_non_k_packed_scaled_input:
    config.unsupported = True
