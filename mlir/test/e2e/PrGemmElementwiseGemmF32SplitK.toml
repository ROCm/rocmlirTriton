directory = "PrGemmElementwiseGemmF32SplitK"
prefix = "rocmlir-gen"
suffix = "--operation gemm_gemm -t f32 --arch %arch -pv %random_data %rocmlir_gen_flags | rocmlir-driver --host-pipeline=highlevel | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/%shlibprefixmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/%shlibprefixconv-validation-wrappers%shlibext,%linalg_test_lib_dir/%shlibprefixmlir_runner_utils%shlibext,%linalg_test_lib_dir/%shlibprefixmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transA"
values = ["true", "false"]
prefix = "--transA="

[[axis]]
name = "transB"
values = ["true", "false"]
prefix = "--transB="

[[axis]]
name = "transC"
values = ["true", "false"]
prefix = "--transC="

[[axis]]
name = "transO"
values = ["true", "false"]
prefix = "--transO="

[[axis]]
name = "splitKFactor"
values = ["attn:v1:32,64,64,1,1,4,0,3,1,0,0",
          "attn:v1:32,64,64,1,1,4,0,8,1,0,0",
          "attn:v1:32,32,256,1,1,2,0,4,1,0,0"]
prefix = "-perf_config="

## gemm+gemm split-k variant
[[suite]]
name = "pr_gemm_gemm_f32_splitk"

[[suite.test]]
config = "-m 384 -n 384 -k 128 -gemmO 128"

[[suite.test]]
config = "-m 64 -n 64 -k 128 -gemmO 128"
