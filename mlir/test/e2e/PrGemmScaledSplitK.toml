directory = "PrGemmScaledSplitK"
prefix = "rocmlir-gen"
suffix = "--operation gemm -out_dtype f32 --arch %arch %pv %constrained_float_range_random_data %rocmlir_gen_flags | rocmlir-driver -c | rocm-run | FileCheck %s --check-prefix="

[[axis]]
name = "splitKFactor"
values = ["gemm:v1:64,64,512,1,1,4,32,2,2,0,0", "gemm:v1:64,64,512,1,1,4,32,3,2,0,0", "gemm:v1:64,64,512,1,1,4,32,3,2,0,0"]
prefix = "-perf_config="

[[axis]]
name = "scaledGemm"
values = ["true", "false"]
prefix = "--scaledGemm=" 

[[axis]]
name = "data type"
values = ["f4E2M1FN"]
prefix = "-t "

[[axis]]
name = "scaleA dtype"
values = ["f8E8M0FNU"]
prefix = "-scale_a_dtype "

[[axis]]
name = "scaleB dtype"
values = ["f8E8M0FNU"]
prefix =  "-scale_b_dtype "

## Gemm variants
[[suite]]
name = "PrGemmScaledSplitK"

[[suite.test]]
config = "-g 3 -m 256 -k 768 -n 256"
