directory = "GemmScaled"
prefix = "rocmlir-gen"
suffix = "--operation gemm -out_dtype f32 --arch %arch %pv %random_data -rand_type float %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transA"
values = ["true", "false"]
prefix = "--transA="

[[axis]]
name = "transB"
values = ["true", "false"]
prefix = "--transB="

[[axis]]
name = "transC"
values = ["true", "false"]
prefix = "--transC="

[[axis]]
name = "data type"
values = ["f4E2M1FN"]
prefix = "-t "

[[axis]]
name = "scaledGemm"
values = ["true", "false"]
prefix = "--scaledGemm=" 

[[axis]]
name = "scaleA dtype"
values = ["f8E8M0FNU"]
prefix = "-scale_a_dtype "

[[axis]]
name = "scaleB dtype"
values = ["f8E8M0FNU"]
prefix =  "-scale_b_dtype "

## Gemm variants
[[suite]]
name = "gemm_scaled"

[[suite.test]]
config = "-g 3 -m 1024 -k 768 -n 1024"

[[suite.test]]
config = "-g 1 -m 1 -k 32 -n 1"
# f4 is packed to i8 along the stride-1 dimension. K-packing only works when K
# is stride-1, which requires transA=false (for A) and transB=true (for B). In
# this case, we can't pack along M/N dimension because they are odd dimensions.
[[suite.test.exclude]]
name = "transA"
values = ["true"]
[[suite.test.exclude]]
name = "transB"
values = ["false"]

[[suite.test]]
config = "-g 1 -m 512 -k 32 -n 512"

# regression: 1x64x256x128 with a pinned perf_config (tile_k=32).
[[suite.test]]
config = "-g 1 -m 64 -k 256 -n 128 --perf_config=gemm:v1:64,64,64,1,1,4,32,1,2,0,0"

# non-power-of-2 M and N (1x66x256x130) exercising the padding path, 
# with tile_k=0 in the perf_config (forces the tuner to pick a tile_k).
[[suite.test]]
config = "-g 1 -m 66 -k 256 -n 130 --perf_config=gemm:v1:64,64,64,1,1,4,0,1,2,0,0"
