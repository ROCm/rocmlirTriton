directory = "PrGemmScaled"
prefix = "rocmlir-gen"
suffix = "--operation gemm -out_dtype f32 --scaledGemm --arch %arch %pv %constrained_float_range_random_data %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transA"
values = ["true", "false"]
prefix = "--transA="

[[axis]]
name = "transB"
values = ["true", "false"]
prefix = "--transB="

[[axis]]
name = "transO"
values = ["true", "false"]
prefix = "--transO="

[[axis]]
name = "data type"
values = ["f4E2M1FN"]
prefix = "-t "

[[axis]]
name = "scaleA dtype"
values = ["f8E8M0FNU"]
prefix = "-scale_a_dtype "

[[axis]]
name = "scaleB dtype"
values = ["f8E8M0FNU"]
prefix =  "-scale_b_dtype "

# fp4 is packed to i8 along the stride-1 dimension. Packing along the non-K
# (M/N) dimension (transB=false for B, or transA=true for A) only lowers on
# arches with the transpose-load repack (CDNA4); gate those variants on the
# `non_k_packed_scaled_input` lit feature. The two blocks are OR-ed together.
[[require]]
feature = "non_k_packed_scaled_input"
[[require.match]]
name = "transB"
values = ["false"]

[[require]]
feature = "non_k_packed_scaled_input"
[[require.match]]
name = "transA"
values = ["true"]

## Gemm variants
[[suite]]
name = "pr_gemm_scaled"

[[suite.test]]
config = "-g 3 -m 1024 -k 768 -n 1024"

# Test large tensors with padding
[[suite.test]]
config = "-g 1 -m 32768 -k 32 -n 32769"
# triton doesn't let us load i4/f4, so we can only load 2 packed i4 as i8
[[suite.test.exclude]]
name = "transB"
values = ["false"]
