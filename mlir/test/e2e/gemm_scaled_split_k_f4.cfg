# These tests use the default (non-transposed) fp4 layout, which packs the
# sub-byte operand along the non-K (M/N) dimension. That path only lowers on
# arches with the transpose-load repack (CDNA4).
if not config.arch_support_scaled_gemm or not config.arch_support_non_k_packed_scaled_input:
    config.unsupported = True
