directory = "gemm_scaled_split_k_f4"
prefix = "rocmlir-gen"
suffix = "--operation gemm -out_dtype f32 --arch %arch %pv %random_data -rand_type float %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/%shlibprefixmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/%shlibprefixconv-validation-wrappers%shlibext,%linalg_test_lib_dir/%shlibprefixmlir_runner_utils%shlibext,%linalg_test_lib_dir/%shlibprefixmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "scaledGemm"
values = ["true", "false"]
prefix = "--scaledGemm=" 

[[axis]]
name = "data type"
values = ["f4E2M1FN"]
prefix = "-t "

[[axis]]
name = "scaleA dtype"
values = ["f8E8M0FNU"]
prefix = "-scale_a_dtype "

[[axis]]
name = "scaleB dtype"
values = ["f8E8M0FNU"]
prefix =  "-scale_b_dtype "

[[axis]]
name = "splitKFactor"
values = ["gemm:v1:64,64,64,1,1,4,0,1,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,2,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,3,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,4,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,5,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,6,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,1,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,2,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,3,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,4,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,5,2,0,0",
          "gemm:v1:64,64,64,1,1,4,0,6,2,0,0"]
          
prefix = "-perf_config="

## Gemm variants
[[suite]]
name = "gemm_scaled_split_k_f4"

[[suite.test]]
config = "-g 3 -m 256 -k 768 -n 256"
