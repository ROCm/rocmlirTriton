directory = "PrGemmDynamic"
prefix = "rocmlir-gen"
suffix = "--operation gemm --arch %arch %pv %random_data %rocmlir_gen_flags | rocmlir-driver -c | rocm-run | FileCheck %s --check-prefix="

# The kernel takes the dimensions named here as runtime arguments; the host
# harness still allocates the sizes given by -g/-m/-k/-n. With only n dynamic,
# A is a static argument of a dynamic kernel.
[[axis]]
name = "dynamic dims"
values = ["n", "m,n", "g,m,n,k"]
prefix = "--dynamic-dims "

[[axis]]
name = "data type"
values = ["f32", "f16"]
prefix = "-t "

[[suite]]
name = "pr_gemm_dynamic"

# Sizes that are multiples of every tile size
[[suite.test]]
config = "-g 1 -m 1024 -k 512 -n 512"

# No dimension is a multiple of the tile, so every edge is masked
[[suite.test]]
config = "-g 3 -m 1000 -k 769 -n 1000"

# Dimensions smaller than one tile
[[suite.test]]
config = "-g 2 -m 7 -k 5 -n 3"

# Transposed operands read the dynamic dimensions with different strides
[[suite.test]]
config = "-g 1 -m 333 -k 129 -n 517 --transA=true --transB=true"

[[suite.test.exclude]]
name = "data type"
values = ["f16"]
