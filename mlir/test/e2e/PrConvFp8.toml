directory = "PrConvFp8"
prefix = "rocmlir-gen"
# The fixed FP8 pattern is binary-exact with f32 accumulation, so require exact
# results instead of the intentionally permissive K-scaled FP8 tolerance.
suffix = "--operation conv -out_dtype f32 --arch %arch %pv -rand fixed -atol 0 -rtol 0 %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "layout"
values = [
  "-fil_layout=gkcyx -in_layout=ngchw -out_layout=ngkhw",
  "-fil_layout=gkyxc -in_layout=nhwgc -out_layout=nhwgk",
]

[[axis]]
name = "data type"
values = ["fp8_fp8", "fp8_bf8", "bf8_fp8", "bf8_bf8"]
prefix = "-t "

[[suite]]
name = "pr_conv_fp8"

[[suite.test]]
config = "-batchsize=8 -groupsize=1 -in_channels=32 -out_channels=32 -in_h=32 -in_w=32 -fil_h=1 -fil_w=1 --dilation_h=1 --dilation_w=1 --padding_h=0 --padding_w=0 --conv_stride_h=1 --conv_stride_w=1"
