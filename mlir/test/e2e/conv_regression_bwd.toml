[[suite.test]]
config = "-groupsize=1 -batchsize=512 -in_channels=256 -out_channels=512 -in_h=7 -in_w=7 -fil_h=3 -fil_w=3 -dilation_h=1 -dilation_w=1 -conv_stride_h=1 -conv_stride_w=1 -padding_h_l=1 -padding_h_r=1 -padding_w_l=1 -padding_w_r=1"

# Split by data type: -atol replaces the K-scaled default rather than raising it,
# and the correct value differs by ~100x between f32 and f16 for this config.
# The two excludes partition the "data type" axis: a new dtype must join exactly
# one of them, or this config is generated twice at conflicting tolerances.
[[suite.test]]
# f32: bwd_weight is the calibrated case, with a random-data K-scaled default of
# 2.007 against an observed worst case of 2.17, so 2.5 gives ~15% headroom.
# bwd_data inherits the same override. Its own default is 0.023, so 2.5 means
# that it fits comfortably.
config = "-groupsize=1 -batchsize=64 -in_channels=256 -out_channels=64 -in_h=56 -in_w=56 -fil_h=3 -fil_w=3 -dilation_h=1 -dilation_w=1 -conv_stride_h=1 -conv_stride_w=1 -padding_h_l=1 -padding_h_r=1 -padding_w_l=1 -padding_w_r=1 --atol 2.5"
[[suite.test.exclude]]
name = "data type"
values = ["f16"]

[[suite.test]]
# f16: no override, deliberately, so each operation keeps its own K-scaled
# default, which already covers the error observed for this config.
config = "-groupsize=1 -batchsize=64 -in_channels=256 -out_channels=64 -in_h=56 -in_w=56 -fil_h=3 -fil_w=3 -dilation_h=1 -dilation_w=1 -conv_stride_h=1 -conv_stride_w=1 -padding_h_l=1 -padding_h_r=1 -padding_w_l=1 -padding_w_r=1"
[[suite.test.exclude]]
name = "data type"
values = ["f32"]

# Cases reported in rocMLIR-internal/issues/71
[[suite.test]]
config = "-groupsize=1 -batchsize=32 -in_channels=32 -out_channels=32 -in_h=7 -in_w=7 -fil_h=1 -fil_w=1 -dilation_h=1 -dilation_w=1 -conv_stride_h=1 -conv_stride_w=1 -padding_h_l=0 -padding_h_r=0 -padding_w_l=0 -padding_w_r=0"

[[suite.test]]
