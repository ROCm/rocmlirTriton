directory = "gemm_split_k_i8"
prefix = "rocmlir-gen"
suffix = "--operation gemm -t i8 --arch %arch %pv %random_data %rocmlir_gen_flags | rocmlir-driver -c | rocm-run | FileCheck %s --check-prefix="

# i8 operands accumulate into an i32 output, so split-K here exercises an
# integer atomic add, which has no arch gate unlike the float cases.
[[axis]]
name = "splitKFactor"
values = ["gemm:splitKFactor=1",
          "gemm:splitKFactor=2",
          "gemm:splitKFactor=3",
          "gemm:splitKFactor=4",
          "gemm:splitKFactor=5",
          "gemm:splitKFactor=6"]
prefix = "-perf_config="

## Gemm variants
[[suite]]
name = "gemm_split_k_i8"

[[suite.test]]
config = "-g 3 -m 256 -k 769 -n 256"
