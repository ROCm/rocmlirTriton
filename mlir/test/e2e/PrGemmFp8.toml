directory = "PrGemmFp8"
prefix = "rocmlir-gen"
suffix = "--operation gemm -out_dtype f32 --arch %arch %pv -rand fixed -atol 0 -rtol 0 %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "data type"
values = ["fp8_fp8", "fp8_bf8", "bf8_fp8", "bf8_bf8"]
prefix = "-t "

[[suite]]
name = "pr_gemm_fp8"

[[suite.test]]
config = "-g 1 -m 64 -k 256 -n 128 --perf_config=gemm:v1:64,64,64,1,1,4,16,1,2,0,0"
