directory = "PrGemmFp8"
prefix = "rocmlir-gen"
# The fixed FP8 pattern is binary-exact with f32 accumulation, so require exact
# results instead of the intentionally permissive K-scaled FP8 tolerance.
suffix = "--operation gemm -out_dtype f32 --arch %arch %pv -rand fixed -atol 0 -rtol 0 %rocmlir_gen_flags | rocmlir-driver -c | rocm-run | FileCheck %s --check-prefix="

[[axis]]
name = "data type"
values = ["fp8_fp8", "fp8_bf8", "bf8_fp8", "bf8_bf8"]
prefix = "-t "

[[suite]]
name = "pr_gemm_fp8"

[[suite.test]]
config = "-g 1 -m 64 -k 256 -n 128"
