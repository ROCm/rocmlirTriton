directory = "PrGemmFp8_Accum16"
prefix = "rocmlir-gen"
suffix = "--operation gemm --arch %arch %pv -rand fixed %rocmlir_gen_flags | rocmlir-driver -c | rocm-run | FileCheck %s --check-prefix="

[[axis]]
name = "accumulation type"
values = ["fp16", "bf16"]
prefix = "-out_dtype "

[[axis]]
name = "data type"
values = ["fp8_fp8", "fp8_bf8", "bf8_fp8", "bf8_bf8"]
prefix = "-t "

[[suite]]
name = "pr_gemm_fp8_accum_16"

[[suite.test]]
config = "-g 1 -m 64 -k 256 -n 128"
