# The suffix intentionally omits `%random_data -rand_type float`. Tests below
# default to `-rand fixed`, which uses small per-dtype patterns that are safe
# under f8E8M0FNU quantization. The f32-scale case explicitly opts in to
# `-rand none` because f32 scales would otherwise get quantized to f8E8M0FNU
# on the GPU but not on the host, breaking CPU/GPU verification.
directory = "GemmScaledF4Regression"
prefix = "rocmlir-gen"
suffix = "--operation gemm -out_dtype f32 --arch %arch %pv %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

# Single-value axis required by the test generator. Every other knob is
# pinned per [[suite.test]] below so each generated test corresponds to
# exactly one (shape, perf_config) pair from the original failing scenario.
[[axis]]
name = "data type"
values = ["f4E2M1FN"]
prefix = "-t "

## Regression coverage for ROCm/rocMLIR-internal#2124 (upstream test added in
## ROCm/rocMLIR#2368): these (shape, perf_config) combinations crashed AMDGPU
## codegen during FP4 scaled-GEMM tuning on gfx950. We reach AMDGPU through
## Triton rather than upstream's direct-to-LLVM path, so this pins the tile
## shapes rather than reproducing the original crash verbatim. The perf_configs
## were translated from upstream's v3 strings with
## `scripts/update_perf_config_format.py --arch mfma`.
[[suite]]
name = "gemm_scaled_f4_regression"

# Original failing perf_config from the issue body
# (m=256, n=50272, k=768 with f8E8M0FNU scales). Upstream v3 form was
# v3:128,256,8,32,16,32,1,1,2,1,1.
[[suite.test]]
config = "-g 1 -m 256 -n 50272 -k 768 -scaledGemm -scale_a_dtype f8E8M0FNU -scale_b_dtype f8E8M0FNU -perf_config=gemm:v1:128,256,256,1,1,4,16,1,2,0,0"

# Additional failing perf_config from the issue comments (same shape).
# Upstream v3 form was v3:32,256,8,32,16,32,1,1,2,1,1.
[[suite.test]]
config = "-g 1 -m 256 -n 50272 -k 768 -scaledGemm -scale_a_dtype f8E8M0FNU -scale_b_dtype f8E8M0FNU -perf_config=gemm:v1:32,256,256,1,1,4,16,1,2,0,0"

# Second case from the issue comments: m=1, n=1000, k=2048 with f32 scales,
# transposed B. Uses `-rand none` because f32 scales would otherwise mismatch
# between host (kept as f32) and GPU (quantized to f8E8M0FNU); see the suffix
# comment above. Upstream v3 form was v3:256,256,4,128,32,32,1,1,2,1,1.
[[suite.test]]
config = "-g 1 -m 1 -n 1000 -k 2048 -transA=false -transB=true -scaledGemm -scale_a_dtype f32 -scale_b_dtype f32 -transScaleA=false -transScaleB=true -perf_config=gemm:v1:256,256,128,1,1,4,32,1,2,0,0 -rand none"
