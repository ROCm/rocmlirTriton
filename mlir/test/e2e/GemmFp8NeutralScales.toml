directory = "GemmFp8NeutralScales"
prefix = "rocmlir-gen"
# `-rand none` fills 1.0, which is the identity for f8E8M0FNU scales, so a
# scaled FP8 GEMM must match the unscaled (scale=1) reference.
suffix = "--operation gemm -out_dtype f32 --scaledGemm --arch %arch %pv -rand none %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "data type"
values = ["fp8_fp8", "bf8_bf8", "fp8_bf8", "bf8_fp8"]
prefix = "-t "

[[axis]]
name = "scaleA dtype"
values = ["f8E8M0FNU"]
prefix = "-scale_a_dtype "

[[axis]]
name = "scaleB dtype"
values = ["f8E8M0FNU"]
prefix = "-scale_b_dtype "

[[suite]]
name = "gemm_fp8_neutral_scales"

# Shapes match upstream; tiles are gemm:v1 with kPerBlock dividing K.
[[suite.test]]
config = "-g 1 -m 64 -k 32 -n 64 --transA=true --transB=false --perf_config=gemm:v1:32,32,32,1,1,4,16,1,2,0,0"

[[suite.test]]
config = "-g 1 -m 128 -k 64 -n 32 --transA=false --transB=false --perf_config=gemm:v1:64,32,32,1,1,4,16,1,2,0,0"

[[suite.test]]
config = "-g 8 -m 32 -k 16 -n 16 --transA=true --transB=true --perf_config=gemm:v1:16,16,16,1,1,1,16,1,2,0,0"

[[suite.test]]
config = "-g 3 -m 64 -k 64 -n 32 --transA=false --transB=true --perf_config=gemm:v1:64,32,32,1,1,4,16,1,2,0,0"
