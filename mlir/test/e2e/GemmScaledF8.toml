directory = "GemmScaledF8"
prefix = "rocmlir-gen"
suffix = "--operation gemm -out_dtype f32 --arch %arch %pv %random_data -rand_type float %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/%shlibprefixmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/%shlibprefixconv-validation-wrappers%shlibext,%linalg_test_lib_dir/%shlibprefixmlir_runner_utils%shlibext,%linalg_test_lib_dir/%shlibprefixmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transA"
values = ["true", "false"]
prefix = "--transA="

[[axis]]
name = "transB"
values = ["true", "false"]
prefix = "--transB="

[[axis]]
name = "transO"
values = ["true", "false"]
prefix = "--transO="

[[axis]]
name = "data type"
values = ["f8E4M3FN"]
prefix = "-t "

[[axis]]
name = "scaledGemm"
values = ["true", "false"]
prefix = "--scaledGemm="

[[axis]]
name = "scaleA dtype"
values = ["f8E8M0FNU"]
prefix = "-scale_a_dtype "

[[axis]]
name = "scaleB dtype"
values = ["f8E8M0FNU"]
prefix =  "-scale_b_dtype "

# Sweep both a pinned perf_config and the empty
# string (== tuner-picked, the rocmlir-gen default).
[[axis]]
name = "perf_config"
values = ["gemm:v1:64,64,64,1,1,4,16,1,2,0,0", ""]
prefix = "--perf_config="

## Gemm variants
[[suite]]
name = "gemm_scaled_f8"

[[suite.test]]
config = "-g 1 -m 64 -k 256 -n 128"

[[suite.test]]
config = "-g 1 -m 1 -k 32 -n 1"
