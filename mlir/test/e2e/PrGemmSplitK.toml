directory = "PrGemmSplitK"
prefix = "rocmlir-gen"
suffix = "--operation gemm --arch %arch %pv %random_data %rocmlir_gen_flags | rocmlir-driver -c | rocm-run | FileCheck %s --check-prefix="

[[axis]]
name = "splitKFactor"
values = ["gemm:v1:64,64,64,1,1,4,32,3,2,0,0", "gemm:v1:64,64,64,1,1,4,32,4,2,0,0"]
prefix = "-perf_config="

[[axis]]
name = "data type"
values = ["f16"]
prefix = "-t "

## Gemm variants
[[suite]]
name = "PrGemmSplitK"

[[suite.test]]
config = "-g 3 -m 256 -k 769 -n 256"
