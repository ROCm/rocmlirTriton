# This'll run whenever we're not building a fat library build, and isn't
# controlled by the e2e test switches.
if not config.enable_rock_driver_any_e2e_test or config.no_AMD_GPU:
  config.unsupported = True

if config.arch.startswith("gfx950"):
  # The hard-coded perf_config pins a non-power-of-two kPerBlock, which gfx950
  # rejects while the LLVM backend bug that miscompiles the peeled K loop is
  # unfixed (see rock::supportsNonPow2KPerBlock).
  config.excludes.add('roll-dot-k-nonpow2-k-tile.e2e.mlir')
