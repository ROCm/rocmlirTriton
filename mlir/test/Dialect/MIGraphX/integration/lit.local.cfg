# This'll run whenever we're not building a fat library build, and isn't
# controlled by the e2e test switches.
if not config.enable_rock_driver_any_e2e_test or config.no_AMD_GPU:
  config.unsupported = True

config.excludes = []

if not config.arch_support_atomic_add_f16:
    config.excludes.append('mixr-dot-add-reduce-sum-f16.e2e.mlir')

if not config.arch_support_atomic_add_bf16:
    config.excludes.append('mixr-dot-add-reduce-sum-bf16.e2e.mlir')
