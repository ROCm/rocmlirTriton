if not config.enable_rock_driver_e2e_test or config.no_AMD_GPU:
  config.unsupported = True

config.excludes = []

if not config.arch_support_atomic_add_f16:
  # This regression uses f16 SplitK, which requires f16 atomic add support.
  config.excludes.append("rock-conv-bwd-data-spill-hoist.mlir")

if not config.arch_support_kpack:
  # The hard-coded perf_config uses kpack=2, which gfx950+/gfx1250+ do not
  # support (see getMaxKpack in AmdArchDb.cpp).
  config.excludes.append("gemm-f32-non-pow2.mlir")
