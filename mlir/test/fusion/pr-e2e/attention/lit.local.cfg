# The hard-coded perf_config uses kpack=2, which gfx950+/gfx1250+ do not
# support (see getMaxKpack in AmdArchDb.cpp). Beyond kpack, the two variants
# check matrix-acceleration codegen that is arch-specific: MFMA on CDNA (gfx9*)
# vs WMMA on RDNA (gfx10*/gfx11*/gfx12*), so each is gated to its hardware.
if not config.arch_support_kpack or not config.arch.startswith("gfx9"):
  config.excludes.add('rock-attention-mfma-kpack2.mlir')

if not config.arch_support_kpack or config.arch.startswith("gfx9"):
  config.excludes.add('rock-attention-wmma-kpack2.mlir')

if not config.arch.startswith("gfx942"):
  config.excludes.add(
      'rock-attention-transposed-bias-direct-load-gfx942.mlir')
