if not config.enable_rock_driver_pr_e2e_test or config.no_AMD_GPU:
  config.unsupported = True

# Per-arch relative tolerance for the fused bf16 reductions in this directory.
#
# The accuracy difference is
# driven by how many of those atomics adds accumulate into the same output position.
# This is determined mainly by mPerBlock and nPerBlock, which come from the
# perf_config.
#
# gfx1250 ends up with a longer bf16 chain than gfx950:
#   - untuned tests: gfx1250 has no tuning entry and falls back to gfx1200's
#     128x128 tile (~64 atomics/position) vs gfx950's 16x16 tile (1 atomic/position).
#   - pinned-perf_config test: same tile, but gfx1250's wave32 halves block_size
#     (32*4 vs 64*4), so ~2x the atomics/position (32 vs 16).
#
# A long chain of same-sign bf16 adds stagnates (swamping) and saturates well
# beyond the default rtol, so gfx1250 needs a loose rtol; other archs keep the
# default (tight) rtol.
#
# Measured min passing rtol on gfx1250: ~0.5. We use 0.7 to leave margin
# against scheduling/tuning changes that shift the error.
reduce_rtol_flag = '-rtol=0.7' if config.arch.startswith('gfx1250') else ''
config.substitutions.append(('%bf16_reduce_rtol_flag', reduce_rtol_flag))
