if not config.enable_rock_driver_pr_e2e_test or config.no_AMD_GPU or not config.arch_support_atomic_add_bf16:
  config.unsupported = True

# Per-arch relative tolerance for the fused bf16 reductions in this directory.
#
# On any arch, the reduction is summed by bf16 atomic adds
# (llvm.amdgcn.raw.ptr.buffer.atomic.fadd.v2bf16) into a bf16 output. The
# accuracy difference is driven by how many of those atomics write on the same
# output element, which Triton decides in LoadStoreOpToLLVM.
#
# gfx1250: the collapse path is not enabled, so each tile fragment is committed
# with its own atomic, generating a long chain (~64-128) of bf16 adds into one output.
# bf16 accumulation of many same-sign terms stagnates (swamping), so the result
# deviates far beyond the default: a loose rtol is required.
#
# Other archs (e.g. gfx950): the partials collapse to ~1 atomic per output element,
# so there is essentially a single bf16 rounding and the default (tight) rtol holds.
#
# Measured min passing rtol on gfx1250: ~0.5. We use 0.7 to leave margin
# against scheduling/tiling changes that shift the error.
reduce_rtol_flag = '-rtol=0.7' if config.arch.startswith('gfx1250') else ''
config.substitutions.append(('%bf16_reduce_rtol_flag', reduce_rtol_flag))
