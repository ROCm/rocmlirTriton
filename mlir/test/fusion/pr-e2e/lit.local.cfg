if not config.enable_rock_driver_pr_e2e_test or config.no_AMD_GPU:
  config.unsupported = True

config.excludes = []

if not config.arch.startswith("gfx12"):
  config.excludes.append('mixr-tadd-tadd-quant-dot.mlir')

if not config.arch.startswith("gfx1100"):
  config.excludes.append('rock-attention-shufflexor-rdna.mlir')

if config.arch.startswith("gfx950"):
  # The hard-coded perf_config uses kpack=2, which is not supported on gfx950
  # (see getMaxKpack in AmdArchDb.cpp).
  config.excludes.append('rock-attention-i8-e2e.mlir')
