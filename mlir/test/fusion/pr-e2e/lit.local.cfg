if not config.enable_rock_driver_pr_e2e_test or config.no_AMD_GPU:
  config.unsupported = True

config.excludes = []

if not config.arch_support_atomic_add_f16:
  # This conv test pins an f16 SplitK perf_config, which requires f16 atomic
  # add support.
  config.excludes.append('rock-conv-grouped-splitk.mlir')

if not config.arch.startswith("gfx12"):
  config.excludes.append('mixr-tadd-tadd-quant-dot.mlir')

if not config.arch.startswith("gfx1100"):
  config.excludes.append('rock-attention-shufflexor-rdna.mlir')

if not config.arch.startswith("gfx950"):
  # The hard-coded perf_config uses a 256x128 GEMM-0 tile that needs 128KB of
  # LDS, which only fits on gfx950's larger LDS. Other arches (incl. gfx942)
  # overflow LDS during lowering.
  config.excludes.append('rock-gemm-gemm-undersized-tile.mlir')

if not config.arch_support_kpack:
  # The hard-coded perf_config uses kpack=2, which gfx950+/gfx1250+ do not
  # support (see getMaxKpack in AmdArchDb.cpp).
  config.excludes.append('rock-attention-i8-e2e.mlir')
