# Every test here uses fp4 operands packed along the non-K (M/N) dimension, so
# they only lower on arches with the transpose-load repack (CDNA4).
if (not config.arch_support_atomic_add_f32 or not config.arch_support_scaled_gemm
        or not config.arch_support_non_k_packed_scaled_input):
  config.unsupported = True

