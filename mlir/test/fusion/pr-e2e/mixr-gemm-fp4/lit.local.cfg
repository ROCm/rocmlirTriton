if not config.arch_support_scaled_gemm:
    config.unsupported = True

# fp4 operands packed along the non-K (M/N) dimension only lower on arches with
# the transpose-load repack (CDNA4). Expose it as a lit feature so the non-K
# tests in this directory can opt in via `// REQUIRES:`, while K-packed tests
# (which lower on any scaled-GEMM arch) keep running.
if config.arch_support_non_k_packed_scaled_input:
    config.available_features.add('non_k_packed_scaled_input')
