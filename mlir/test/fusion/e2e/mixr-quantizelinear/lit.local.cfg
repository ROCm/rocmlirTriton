# gfx942 only supports FNUZ FP8, while this test uses OCP f8E4M3FN.
if not config.arch_support_accel_fp8 or "gfx942" in config.arch:
    config.excludes.add("mixr-quant-quant-dot-bias-f8E4M3FN.mlir")

# TODO(rocmlirTriton): Enable these tests also for Navi4 when LCOMPILER-2609 is
# fixed in LLVM.
#
# These tests validate the hardware OCP conversion instructions against a host
# reference: the plain cvt instructions on gfx117x, and the scaled cvt
# instructions with a neutral scale on gfx950 and gfx1250. Other architectures
# are excluded for one of three reasons: gfx942's cvt mnemonics encode FNUZ
# rather than OCP, RDNA3 and older have no fp8 conversion hardware at all, and
# RDNA4 has the plain instructions but is kept on the software path because its
# packed upcast hits the upstream AMDGPU real-true16 print/parse bug.
arch_has_ocp_fp8_cvt = ("gfx117" in config.arch or "gfx950" in config.arch
                        or "gfx1250" in config.arch)
if not arch_has_ocp_fp8_cvt:
    config.excludes.add("mixr-fp8-cvt-f8E4M3FN.mlir")
    config.excludes.add("mixr-bf8-cvt-f8E5M2.mlir")
