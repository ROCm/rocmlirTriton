# zizmor configuration for rocmlirTriton
# Reference: https://docs.zizmor.sh/configuration/
#
# pr-security-scan.yml and weekly-security-scan.yml pass this file to the
# shared ROCm/rocm-security-gh scan, where it replaces the shared default
# config wholesale rather than layering onto it. zizmor has no path
# exclusions; the vendored trees' workflows are kept out of the scan by the
# `/external/*/.github` entry in the root .gitignore.
#
# Per-rule ignore lists and tuning live under `rules:`, as
# `<rule-id>: { ignore: [file.yml:line:col] }`, which keeps a suppression
# reviewable in one place rather than scattered as inline comments
# across workflows.
rules:
  dangerous-triggers:
    ignore:
      # These Claude review companions need pull_request_target so they can
      # label and comment on fork PRs. Neither checks out or runs PR code, and
      # both run with `permissions: {}` plus a scoped in-step App token; see
      # sections 5 and 9 of .github/workflows/CLAUDE_AUTO_REVIEW.md. Both files
      # are in the Claude CI perimeter, so any change to them gets the
      # modifies-ci-paths audit.
      - claude_auto_review_fork_notify.yml
      - claude_auto_review_perimeter_banner.yml
