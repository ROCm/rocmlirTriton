# bandit configuration for rocmlirTriton
# Reference: https://bandit.readthedocs.io/en/latest/config.html
#
# pr-security-scan.yml and weekly-security-scan.yml pass this file to the
# shared ROCm/rocm-security-gh scan, where it replaces the shared default
# config wholesale rather than layering onto it. Exclusions and suppressions
# for this repository (e.g. `skips: [...]`) belong here.

exclude_dirs:
  - .git
  - .venv
  - venv
  - build
  - dist
  - node_modules
  - __pycache__
  # Vendored upstream trees (LLVM, Triton). bandit treats each entry as a
  # substring of the scanned path, so the slashes keep this to the directory.
  - /external/
