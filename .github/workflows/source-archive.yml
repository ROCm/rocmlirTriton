name: Source Archive

# Produces a self-contained source tarball: the repo plus all the dependencies.
# Points FETCHCONTENT_BASE_DIR to <source>/external to place dependencies
# *inside* the source tree, so CPack's source generator picks them up.
#
# NOTE for consumers of the archive: because the *-subbuild/ stamp directories
# are stripped, a plain `cmake -B build -DFETCHCONTENT_BASE_DIR=external` on an
# unpacked archive would re-download the dependencies. Add
# -DFETCHCONTENT_FULLY_DISCONNECTED=ON to build fully offline.

on:
  push:
    branches:
      - develop

# One archive per ref is enough; supersede an in-flight run on a new push.
concurrency:
  group: source-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve commit hash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          {
            echo "SHA=$sha"
            echo "TAG=source-$sha"
          } >> "$GITHUB_ENV"
          echo "Archiving commit $sha"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xz-utils python3-dev python3-pybind11

      # Configure only - fetches dependencies to external
      # MLIR_ENABLE_ROCM_RUNNER=OFF to run without ROCm
      - name: Configure (fetches dependencies into external/)
        run: |
          set -euo pipefail
          cmake -B build -G Ninja \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/external" \
            -DMLIR_ENABLE_ROCM_RUNNER=OFF
          du -sh external/* || true
          df -h /

      - name: Create source archive
        run: |
          set -euo pipefail
          cpack -G TXZ \
            -D CPACK_THREADS=0 \
            -B "$RUNNER_TEMP/package" \
            --config build/CPackSourceConfig.cmake

          src=$(find "$RUNNER_TEMP/package" -maxdepth 1 -name '*.tar.xz' -print -quit)
          if [ -z "$src" ]; then
            echo "::error::cpack produced no .tar.xz" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/artifact"
          mv "$src" "$RUNNER_TEMP/artifact/rocmlirTriton.tar.xz"
          ls -lh "$RUNNER_TEMP/artifact"

      - name: Publish release
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/artifact/rocmlirTriton.tar.xz"

          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "Source archive"
          fi

          gh release upload "$TAG" "$file" -R "$GITHUB_REPOSITORY" --clobber

          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/rocmlirTriton.tar.xz"
          echo "Published $url"
          {
            echo "### Source archive released"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- tag: \`${TAG}\`"
            echo "- download: ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
